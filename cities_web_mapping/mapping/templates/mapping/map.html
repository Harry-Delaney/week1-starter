<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Map Dublin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([{{ dublin_lat }}, {{ dublin_lon }}], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        const markers = [
            {
                lat: 53.3432,
                lon: -6.2575,
                name: 'Trinity College Dublin',
                popup: 'Trinity College Dublin - Founded 1592'
            },
            {
                lat: 53.3414,
                lon: -6.2725,
                name: 'Dublin Castle',
                popup: 'Dublin Castle - Historic seat of power'
            },
            {
                lat: 53.3416,
                lon: -6.2831,
                name: 'Temple Bar',
                popup: 'Temple Bar - Historic neighborhood'
            }
        ];
        
        markers.forEach(function(marker) {
            L.marker([marker.lat, marker.lon])
                .addTo(map)
                .bindPopup('<b>' + marker.name + '</b><br>' + marker.popup);
        });
    </script>
</body>
</html>
